[tool.poetry]
name = "bank_widget"
version = "0.1.0"
description = "Bank transactions processing widget"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.13"
openpyxl = ">=3.1.0"
pandas = ">=2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4.1"
pytest-cov = ">=4.0.0"
black = ">=24.4.2"
isort = ">=5.13.2"
mypy = ">=1.9.0"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
black = "^25.1.0"
isort = "^6.0.1"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = '''
/(\.git|venv)/
'''

[tool.isort]
profile = "black"
line_length = 119
skip = [
    "myenv",
    ".venv",
    "venv",
    "**/site-packages/**",
    "**/__pycache__/**",
    "**/.git/**"
]
known_first_party = ["src"]
combine_as_imports = true
combine_as = true  # Объединяет импорты из одного модуля
force_single_line = true

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv/'

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"